<title>MuZ Live Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: the headunit screen at 5:3 on a dark bench, a slim debug strip beneath it.
   Single deliberate dark look (it's a dashboard bench), every color set explicitly. */
:root {
  color-scheme: dark;
  --bench: #17110f;          /* warm near-black, leans toward the brand red */
  --panel: #221917;
  --line: #3a2c29;
  --ink: #f3e9e6;
  --ink-dim: #a8958f;
  --red: #db0a20;            /* app's Brand.Red */
  --red-text: #e5213a;       /* app's Brand.RedText */
  --red-muted: rgba(224, 40, 60, 0.55);
  --frost: rgba(250, 218, 218, 0.90);
  --ok: #7fd6a4;
  --font-app: "Roboto", system-ui, sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bench); color: var(--ink);
  font: 14px/1.45 var(--font-app);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  box-sizing: border-box;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; }

/* ---------- The headunit screen (2000x1200 design canvas) ---------- */
.stage { container-type: inline-size; }
.screen {
  --u: 0.05cqw;               /* 1 design px = 100cqw / 2000 */
  position: relative; width: 100%; aspect-ratio: 5 / 3; max-width: 100%;
  overflow: hidden; border-radius: 10px;
  background: #c4001a url("home_background.jpg") center / cover no-repeat;
  box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,.45);
  font-family: var(--font-app);
  user-select: none;
}
.screen:fullscreen { border-radius: 0; width: 100vw; height: auto; max-height: 100vh; }

.bar {
  position: absolute; top: calc(64 * var(--u)); left: calc(96 * var(--u)); right: calc(96 * var(--u));
  height: calc(232 * var(--u)); border-radius: 999px; background: var(--frost);
  display: flex; align-items: center;
  padding: 0 calc(52 * var(--u)) 0 calc(66 * var(--u));
  cursor: text;
}
.bar svg.search { width: calc(108 * var(--u)); height: calc(108 * var(--u)); flex: none; }
.bar input {
  flex: 1; min-width: 0; margin-left: calc(36 * var(--u));
  border: 0; outline: 0; background: transparent; padding: 0;
  font: 400 calc(92 * var(--u)) / 1 var(--font-app); color: var(--red-text);
  caret-color: var(--red);
}
.bar input::placeholder { color: var(--red-text); opacity: 1; }
.mic, .clear {
  width: calc(150 * var(--u)); height: calc(150 * var(--u)); flex: none;
  border: 0; border-radius: 50%; background: transparent; cursor: pointer;
  display: grid; place-items: center; padding: 0;
  transition: background .15s;
}
.clear[hidden] { display: none; }
.mic:active, .clear:active { background: rgba(219, 10, 32, .14); }
.mic:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
.clear svg { width: calc(80 * var(--u)); height: calc(80 * var(--u)); }
.mic svg { width: calc(96 * var(--u)); height: calc(96 * var(--u)); }

.title {
  position: absolute; left: 50%; top: 50%;
  width: calc(1090 * var(--u)); max-width: none;
  transform: translate(-50%, calc(-50% + 20 * var(--u)));
  pointer-events: none;
}

/* Search mode: frosted glass + "Listen..." zooms out */
.glass, .veil { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  transition: opacity .42s cubic-bezier(.4,0,.2,1), transform .42s cubic-bezier(.4,0,.2,1); }
.glass { background: url("home_background_blur.jpg") center / cover no-repeat; transform: scale(1.04); }
.veil { background: rgba(42, 0, 6, .12); }
.searching .glass { opacity: 1; transform: scale(1); }
.searching .veil { opacity: 1; }
.title { transition: opacity .42s cubic-bezier(.4,0,.2,1), transform .42s cubic-bezier(.4,0,.2,1); }
.searching .title { opacity: 0; transform: translate(-50%, calc(-50% + 20 * var(--u))) scale(.65); }
.catcher { position: absolute; inset: 0; }

.suggest {
  position: absolute; top: calc(336 * var(--u)); left: calc(282 * var(--u)); right: calc(300 * var(--u));
  margin: 0; padding: 0; list-style: none;
}
.suggest button {
  display: block; width: 100%; height: calc(176 * var(--u)); padding: 0 calc(24 * var(--u));
  border: 0; border-radius: calc(24 * var(--u)); background: transparent; cursor: pointer;
  text-align: left; color: #fff; font: 400 calc(76 * var(--u)) / 1 var(--font-app);
  text-shadow: 0 2px 8px rgba(0,0,0,.33);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  animation: rise .32s cubic-bezier(.4,0,.2,1) both;
  animation-delay: calc(var(--i) * 45ms);
}
.suggest button b { font-weight: 700; }
.suggest button:hover, .suggest button:focus-visible { background: rgba(255,255,255,.12); outline: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(calc(24 * var(--u))); } }
@media (prefers-reduced-motion: reduce) {
  .suggest button { animation: none; }
  .glass, .veil, .title { transition: none; }
}
.bounds .suggest button { outline: 1px dashed #00e5ff; }

/* Search mode: bar rises and slims down (same numbers as SearchBar.kt) */
.bar, .bar svg.search, .bar input, .mic, .clear, .mic svg, .clear svg, .suggest {
  transition-property: top, height, width, padding, margin, font-size, left;
  transition-duration: .42s; transition-timing-function: cubic-bezier(.4,0,.2,1);
}
.searching .bar { top: calc(28 * var(--u)); height: calc(168 * var(--u));
  padding: 0 calc(40 * var(--u)) 0 calc(54 * var(--u)); }
.searching .bar svg.search { width: calc(84 * var(--u)); height: calc(84 * var(--u)); }
.searching .bar input { font-size: calc(72 * var(--u)); margin-left: calc(30 * var(--u)); }
.searching .mic, .searching .clear { width: calc(130 * var(--u)); height: calc(130 * var(--u)); }
.searching .mic svg { width: calc(80 * var(--u)); height: calc(80 * var(--u)); }
.searching .clear svg { width: calc(66 * var(--u)); height: calc(66 * var(--u)); }
.searching .suggest { top: calc(236 * var(--u)); left: calc(240 * var(--u)); }
@media (prefers-reduced-motion: reduce) {
  .bar, .bar svg.search, .bar input, .mic, .clear, .mic svg, .clear svg, .suggest { transition: none; }
}

/* Android-style toast */
.toast {
  position: absolute; left: 50%; bottom: calc(110 * var(--u));
  transform: translateX(-50%);
  background: rgba(32, 32, 32, .92); color: #fff;
  font: 400 calc(40 * var(--u)) / 1.2 var(--font-app);
  padding: calc(26 * var(--u)) calc(48 * var(--u)); border-radius: 999px;
  white-space: nowrap; transition: opacity .2s;
}

/* System voice dialog stand-in */
.voice {
  position: absolute; inset: 0; background: rgba(0,0,0,.45);
  display: grid; place-items: center;
}
.voice-card {
  width: calc(900 * var(--u)); background: #fff; color: #202124;
  border-radius: calc(36 * var(--u)); padding: calc(56 * var(--u));
  display: grid; gap: calc(36 * var(--u)); justify-items: center;
  font-size: calc(40 * var(--u));
}
.voice-card .dot {
  width: calc(150 * var(--u)); height: calc(150 * var(--u)); border-radius: 50%;
  background: var(--red); display: grid; place-items: center;
  animation: pulse 1.4s ease-in-out infinite;
}
.voice-card .dot svg { width: 50%; height: 50%; }
.voice-card input {
  width: 100%; box-sizing: border-box; font: inherit; color: inherit;
  border: 0; border-bottom: 2px solid #dadce0; padding: .3em 0; outline: 0; text-align: center;
}
.voice-card input:focus { border-color: var(--red); }
.voice-card .row { display: flex; gap: calc(24 * var(--u)); }
.voice-card button {
  font: 500 calc(36 * var(--u)) var(--font-app); border: 0; cursor: pointer;
  padding: .5em 1.2em; border-radius: 999px; background: #f1f3f4; color: #202124;
}
.voice-card button.go { background: var(--red); color: #fff; }
@keyframes pulse { 50% { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .voice-card .dot { animation: none; } }

/* Layout bounds overlay (like Android's "Show layout bounds") */
.bounds .bar, .bounds .title, .bounds .mic, .bounds .bar svg.search, .bounds .bar input {
  outline: 1px dashed #00e5ff; outline-offset: 0;
}
.bounds .screen::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(0,229,255,.18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,.18) 1px, transparent 1px);
  background-size: calc(100 * var(--u)) calc(100 * var(--u));
}

/* ---------- Debug strip ---------- */
.strip {
  display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start;
}
@media (max-width: 720px) { .strip { grid-template-columns: 1fr; } }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  font: 500 12px var(--font-app); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-dim); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 10px; background: var(--panel);
}
.chip b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; text-transform: none; letter-spacing: 0; }
.btn {
  font: 500 13px var(--font-app); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer;
}
.btn:hover { border-color: var(--ink-dim); }
.btn:focus-visible { outline: 2px solid var(--red-text); outline-offset: 2px; }
.btn[aria-pressed="true"] { border-color: #00e5ff; color: #00e5ff; }
.log {
  min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  font: 12px/1.6 var(--font-mono); color: var(--ink-dim);
  padding: 8px 12px; height: 7.4em; overflow-y: auto; margin: 0; list-style: none;
}
.log li { white-space: pre-wrap; word-break: break-word; }
.log time { color: #6f5f5a; margin-right: 8px; }
.log .ev { color: var(--ok); }
</style>

<div class="wrap" id="wrap">
  <div class="stage">
    <div class="screen" id="screen" aria-label="Headunit screen, 2000 by 1200">
      <div class="glass"></div>
      <div class="veil"></div>
      <div class="catcher" id="catcher" hidden></div>
      <label class="bar" id="bar" for="q">
        <svg class="search" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="7.5" fill="none" stroke="var(--red)" stroke-width="2.6"/>
          <path d="M16 16l5.5 5.5" stroke="var(--red)" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <input id="q" type="text" placeholder="Search" autocomplete="off" enterkeyhint="search" aria-label="Search">
        <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="var(--red-muted)" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <button class="mic" id="mic" type="button" aria-label="Voice search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0v-6a3 3 0 0 1 3-3z" fill="var(--red-muted)"/>
            <path d="M5.5 10.5v1a6.5 6.5 0 0 0 13 0v-1M12 18v3M8.5 21.2h7" fill="none" stroke="var(--red-muted)" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </label>

      <img class="title" src="listen_title.png" alt="Listen...">

      <ul class="suggest" id="suggest" aria-label="Suggestions"></ul>

      <div class="toast" id="toast" hidden></div>

      <div class="voice" id="voice" hidden>
        <form class="voice-card" id="voiceForm">
          <div class="dot"><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0v-6a3 3 0 0 1 3-3z" fill="#fff"/>
            <path d="M5.5 10.5v1a6.5 6.5 0 0 0 13 0v-1M12 18v3M8.5 21.2h7" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
          </svg></div>
          <div>Say a song, artist or album</div>
          <input id="spoken" placeholder="Type what you'd say" autocomplete="off" aria-label="Spoken words">
          <div class="row">
            <button type="button" id="cancelVoice">Cancel</button>
            <button type="submit" class="go">Done</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="strip">
    <div class="controls">
      <span class="chip">Canvas <b>2000×1200</b></span>
      <span class="chip">Scale <b id="scale">–</b></span>
      <span class="chip">Back <b>Esc</b></span>
      <span class="chip">Build <b>home v0.5</b></span>
      <button class="btn" id="boundsBtn" type="button" aria-pressed="false">Layout bounds</button>
      <button class="btn" id="fsBtn" type="button">Fullscreen</button>
      <button class="btn" id="resetBtn" type="button">Reset</button>
    </div>
    <ul class="log" id="log" aria-label="Event log"></ul>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const q = $('q'), log = $('log'), toastEl = $('toast'), voice = $('voice');

function stamp() {
  return new Date().toLocaleTimeString([], { hour12: false });
}
function logEvent(name, detail = '') {
  const li = document.createElement('li');
  li.innerHTML = `<time>${stamp()}</time><span class="ev"></span> <span class="d"></span>`;
  li.querySelector('.ev').textContent = name;
  li.querySelector('.d').textContent = detail;
  log.appendChild(li);
  log.scrollTop = log.scrollHeight;
}

let toastTimer;
function toast(msg) {          // Toast.LENGTH_SHORT ≈ 2s
  toastEl.textContent = msg;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2000);
}

// ---- Suggestions: same logic as LocalSuggestionProvider.kt ----
const CATALOGUE = ["Taylor Swift","Taylor Swift Cruel Summer","Taylor Swift Anti-Hero","The Weeknd","The Weeknd Blinding Lights","The Weeknd Save Your Tears","Drake","Drake One Dance","Drake God's Plan","Billie Eilish","Billie Eilish Birds of a Feather","Billie Eilish Lovely","Sabrina Carpenter Espresso","Sabrina Carpenter Please Please Please","Kendrick Lamar","Kendrick Lamar Not Like Us","Kendrick Lamar Humble","SZA","SZA Kill Bill","SZA Saturn","Bad Bunny","Bad Bunny Tití Me Preguntó","Dua Lipa","Dua Lipa Levitating","Dua Lipa Houdini","Ed Sheeran Shape of You","Ed Sheeran Perfect","Harry Styles As It Was","Harry Styles Watermelon Sugar","Post Malone","Post Malone Circles","Post Malone Sunflower","Olivia Rodrigo","Olivia Rodrigo Drivers License","Olivia Rodrigo Vampire","Arctic Monkeys Do I Wanna Know","Arctic Monkeys 505","Coldplay","Coldplay Yellow","Coldplay Viva La Vida","Imagine Dragons Believer","Imagine Dragons Thunder","Travis Scott","Travis Scott Sicko Mode","Bruno Mars","Bruno Mars Uptown Funk","Bruno Mars Die With A Smile","Lady Gaga","Chappell Roan Good Luck Babe","Chappell Roan Pink Pony Club","Hozier Too Sweet","Benson Boone Beautiful Things","Queen Bohemian Rhapsody","Michael Jackson Billie Jean","Fleetwood Mac Dreams","Eagles Hotel California","Daft Punk Get Lucky","Frank Ocean","Frank Ocean Pink + White","Tame Impala The Less I Know The Better","Mac Miller","Lofi hip hop radio","Lofi beats to study to","Road trip playlist","Driving music","Chill vibes playlist","Workout music","Top hits 2026","Throwback hits","90s hip hop","80s rock"];
const SUFFIXES = ["songs","live","remix","playlist","acoustic"];
const MAX_SUGGESTIONS = 5, DEBOUNCE_MS = 120;

function suggest(query, limit) {
  const qq = query.trim().toLowerCase();
  if (!qq) return [];
  const starts = CATALOGUE.filter(e => e.toLowerCase().startsWith(qq));
  const words = CATALOGUE.filter(e => !starts.includes(e) &&
    e.toLowerCase().split(/[ \-(]/).some(w => w.startsWith(qq)));
  const out = [...starts, ...words].map(e => e.toLowerCase()).concat(SUFFIXES.map(x => `${qq} ${x}`));
  return [...new Set(out)].slice(0, limit);
}

const screen = $('screen'), sugEl = $('suggest'), clearBtn = $('clear'), catcher = $('catcher');
let focused = false, current = [];

function renderSuggestions(list) {
  // Keep rows that are still there; only new rows animate in (like key(text) in Compose).
  const typed = q.value.trim();
  const old = new Map([...sugEl.children].map(li => [li.dataset.text, li]));
  sugEl.innerHTML = '';
  list.forEach((text, i) => {
    let li = old.get(text);
    if (!li) {
      li = document.createElement('li');
      li.dataset.text = text;
      const b = document.createElement('button');
      b.type = 'button';
      b.style.setProperty('--i', i);
      b.addEventListener('pointerdown', e => e.preventDefault()); // keep keyboard focus
      b.addEventListener('click', () => { logEvent('suggestion:pick', JSON.stringify(text)); submit(text); });
      li.appendChild(b);
    } else {
      li.firstChild.style.animation = 'none';     // already shown, don't replay
    }
    const b = li.firstChild;
    b.textContent = '';
    if (typed && text.toLowerCase().startsWith(typed.toLowerCase())) {
      b.append(text.slice(0, typed.length));
      const strong = document.createElement('b'); strong.textContent = text.slice(typed.length);
      b.append(strong);
    } else b.textContent = text;
    sugEl.appendChild(li);
  });
  current = list;
}

function updateMode() {
  const searching = focused || q.value.length > 0;
  if (screen.classList.contains('searching') !== searching) {
    logEvent('mode', searching ? 'search (title zooms out, glass on)' : 'idle');
  }
  screen.classList.toggle('searching', searching);
  catcher.hidden = !searching;
  clearBtn.hidden = q.value.length === 0;
  if (!focused) renderSuggestions([]);  // only while typing
}

let debounce;
q.addEventListener('input', () => {
  updateMode();
  clearTimeout(debounce);
  if (!q.value.trim()) { renderSuggestions([]); return; }
  debounce = setTimeout(() => {
    const list = suggest(q.value, MAX_SUGGESTIONS);
    renderSuggestions(list);
    logEvent('suggest', `${JSON.stringify(q.value)} → ${list.length} results`);
  }, DEBOUNCE_MS);
});

function onSearch(query) {     // mirrors MainActivity.onSearch
  logEvent('onSearch', JSON.stringify(query));
  toast(`Searching “${query}”`);
}
function submit(text) {
  q.value = text;
  q.blur();
  onSearch(text);
  updateMode();
}

q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = q.value.trim();
    if (v) submit(v);
    else logEvent('ime:search', 'ignored, query is blank');
  }
});
q.addEventListener('focus', () => { focused = true; logEvent('focus', 'search field (keyboard opens on device)'); updateMode(); });
q.addEventListener('blur', () => { focused = false; logEvent('blur', 'search field'); updateMode(); });

clearBtn.addEventListener('pointerdown', e => e.preventDefault());
clearBtn.addEventListener('click', (e) => {
  e.preventDefault(); e.stopPropagation();
  q.value = ''; renderSuggestions([]); q.focus(); updateMode();
  logEvent('clear', 'query cleared');
});
catcher.addEventListener('click', () => { q.blur(); logEvent('tap', 'outside bar → hide keyboard'); });

// Escape = Android back: leave search mode.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && screen.classList.contains('searching') && voice.hidden) {
    q.value = ''; q.blur(); updateMode();
    logEvent('back', 'BackHandler → leave search');
  }
});

$('mic').addEventListener('click', (e) => {
  e.preventDefault(); e.stopPropagation();
  logEvent('onVoiceSearch', 'RecognizerIntent.ACTION_RECOGNIZE_SPEECH');
  voice.hidden = false;
  $('spoken').value = '';
  $('spoken').focus();
});
$('cancelVoice').addEventListener('click', () => {
  voice.hidden = true;
  logEvent('voice:result', 'cancelled (RESULT_CANCELED)');
});
$('voiceForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const said = $('spoken').value.trim();
  voice.hidden = true;
  if (!said) { logEvent('voice:result', 'no speech'); return; }
  logEvent('voice:result', JSON.stringify(said));
  submit(said);               // LaunchedEffect(voiceResult): fill box, then search
});

$('boundsBtn').addEventListener('click', (e) => {
  const on = $('wrap').classList.toggle('bounds');
  e.currentTarget.setAttribute('aria-pressed', on);
  logEvent('debug', `layout bounds ${on ? 'on' : 'off'}`);
});
$('fsBtn').addEventListener('click', async () => {
  try { await $('screen').requestFullscreen(); }
  catch { logEvent('debug', 'fullscreen not available in this view'); }
});
$('resetBtn').addEventListener('click', () => {
  q.value = ''; q.blur(); voice.hidden = true; toastEl.hidden = true;
  renderSuggestions([]); updateMode();
  log.innerHTML = '';
  logEvent('app', 'MainActivity.onCreate → HomeScreen');
});

function updateScale() {
  const w = $('screen').getBoundingClientRect().width;
  $('scale').textContent = `${(w / 2000 * 100).toFixed(1)}%`;
}
new ResizeObserver(updateScale).observe($('screen'));
updateScale();
logEvent('app', 'MainActivity.onCreate → HomeScreen');
</script>
