<title>MuZ Live Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: the headunit screen at 5:3 on a dark bench, a slim debug strip beneath it.
   Single deliberate dark look (it's a dashboard bench), every color set explicitly. */
:root {
  color-scheme: dark;
  --bench: #17110f;          /* warm near-black, leans toward the brand red */
  --panel: #221917;
  --line: #3a2c29;
  --ink: #f3e9e6;
  --ink-dim: #a8958f;
  --red: #db0a20;            /* app's Brand.Red */
  --red-text: #e5213a;       /* app's Brand.RedText */
  --red-muted: rgba(224, 40, 60, 0.55);
  --frost: rgba(250, 218, 218, 0.90);
  --ok: #7fd6a4;
  --font-app: "Roboto", system-ui, sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.4, 0, .2, 1);
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bench); color: var(--ink);
  font: 14px/1.45 var(--font-app);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  box-sizing: border-box;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; }

/* ---------- The headunit screen (2000x1200 design canvas) ---------- */
.stage { container-type: inline-size; }
.screen {
  --u: 0.05cqw;               /* 1 design px = 100cqw / 2000 */
  position: relative; width: 100%; aspect-ratio: 5 / 3; max-width: 100%;
  overflow: hidden; border-radius: 10px;
  background: #c4001a url("home_background.jpg") center / cover no-repeat;
  box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,.45);
  font-family: var(--font-app);
  user-select: none; -webkit-user-select: none;
  outline: none;
}
.screen:fullscreen { border-radius: 0; width: 100vw; height: auto; max-height: 100vh; }

/* Search bar (SearchBar.kt) */
.bar {
  position: absolute; top: calc(64 * var(--u)); left: calc(96 * var(--u)); right: calc(96 * var(--u));
  height: calc(232 * var(--u)); border-radius: 999px; background: var(--frost);
  display: flex; align-items: center;
  padding: 0 calc(52 * var(--u)) 0 calc(66 * var(--u));
  cursor: pointer;
}
.bar svg.search { width: calc(108 * var(--u)); height: calc(108 * var(--u)); flex: none; }
.field {
  flex: 1; min-width: 0; margin-left: calc(36 * var(--u));
  display: flex; align-items: center; overflow: hidden; justify-content: flex-start;
  font: 400 calc(92 * var(--u)) / 1 var(--font-app); color: var(--red-text);
  white-space: pre;
}
.field.long { justify-content: flex-end; }   /* long query: keep the end in view */
.caret {
  flex: none; width: calc(7 * var(--u)); height: 1.1em; margin: 0 calc(4 * var(--u));
  background: var(--red); border-radius: calc(4 * var(--u)); opacity: 0;
}
.caret.on { animation: blink 1.06s step-end infinite; }
@keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

.mic, .clear {
  width: calc(150 * var(--u)); height: calc(150 * var(--u)); flex: none;
  border: 0; border-radius: 50%; background: transparent; cursor: pointer;
  display: grid; place-items: center; padding: 0;
}
.mic:active, .clear:active { background: rgba(219, 10, 32, .14); }
.mic:focus-visible, .clear:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
.clear svg { width: calc(80 * var(--u)); height: calc(80 * var(--u)); }
.mic svg { width: calc(96 * var(--u)); height: calc(96 * var(--u)); }

.title {
  position: absolute; left: 50%; top: 50%;
  width: calc(1090 * var(--u)); max-width: none;
  transform: translate(-50%, calc(-50% + 20 * var(--u)));
  pointer-events: none;
}

/* Search mode: frosted glass + "Listen..." zooms out */
.glass, .veil { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  transition: opacity .42s var(--ease), transform .42s var(--ease); }
.glass { background: url("home_background_blur.jpg") center / cover no-repeat; transform: scale(1.04); }
.veil { background: rgba(42, 0, 6, .12); }
.searching .glass { opacity: 1; transform: scale(1); }
.searching .veil { opacity: 1; }
.title { transition: opacity .42s var(--ease), transform .42s var(--ease); }
.searching .title { opacity: 0; transform: translate(-50%, calc(-50% + 20 * var(--u))) scale(.65); }
.catcher { position: absolute; inset: 0; }

/* Bar rises and slims down (same numbers as SearchBar.kt) */
.bar, .bar svg.search, .field, .mic, .clear, .mic svg, .clear svg, .suggest {
  transition-property: top, height, width, padding, margin, font-size, left;
  transition-duration: .42s; transition-timing-function: var(--ease);
}
.searching .bar { top: calc(28 * var(--u)); height: calc(168 * var(--u));
  padding: 0 calc(40 * var(--u)) 0 calc(54 * var(--u)); }
.searching .bar svg.search { width: calc(84 * var(--u)); height: calc(84 * var(--u)); }
.searching .field { font-size: calc(72 * var(--u)); margin-left: calc(30 * var(--u)); }
.searching .mic, .searching .clear { width: calc(130 * var(--u)); height: calc(130 * var(--u)); }
.searching .mic svg { width: calc(80 * var(--u)); height: calc(80 * var(--u)); }
.searching .clear svg { width: calc(66 * var(--u)); height: calc(66 * var(--u)); }

/* Suggestions (SearchSuggestions.kt) */
.suggest {
  position: absolute; top: calc(336 * var(--u)); left: calc(282 * var(--u)); right: calc(300 * var(--u));
  margin: 0; padding: 0; list-style: none;
}
.searching .suggest { top: calc(220 * var(--u)); left: calc(126 * var(--u)); right: calc(136 * var(--u)); }
/* Scrolls (long history); last rows can scroll clear of the keyboard. */
.searching .suggest {
  bottom: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  padding-bottom: calc(24 * var(--u)); box-sizing: border-box;
  -webkit-mask-image: linear-gradient(transparent, #000 calc(40 * var(--u)));
  mask-image: linear-gradient(transparent, #000 calc(40 * var(--u)));
}
.searching.kb-up .suggest { padding-bottom: calc(564 * var(--u)); }
.suggest::-webkit-scrollbar { display: none; }
/* icon slot sits under the bar's magnifier, text under the typed text, × under the mic */
.suggest li {
  display: flex; align-items: center; height: calc(150 * var(--u));
  border-radius: calc(24 * var(--u));
  animation: rise .32s var(--ease) both;
  animation-delay: calc(var(--i) * 45ms);
}
.suggest li:hover, .suggest li:focus-within { background: rgba(255,255,255,.12); }
.suggest .pick {
  flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: calc(30 * var(--u));
  padding: 0 0 0 calc(24 * var(--u)); border: 0; background: transparent; cursor: pointer;
  text-align: left; color: #fff; font: 400 calc(76 * var(--u)) / 1 var(--font-app);
  text-shadow: 0 2px 8px rgba(0,0,0,.33); outline: 0;
}
.suggest .ico { flex: none; width: calc(84 * var(--u)); display: grid; place-items: center; }
.suggest .ico svg { width: calc(52 * var(--u)); height: calc(52 * var(--u)); opacity: .45; }
.suggest .hist .ico svg { width: calc(60 * var(--u)); height: calc(60 * var(--u)); opacity: .85; }
.suggest .txt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggest .txt b { font-weight: 700; }
.suggest .rm {
  flex: none; width: calc(130 * var(--u)); height: calc(130 * var(--u)); border-radius: 50%;
  border: 0; background: transparent; cursor: pointer; display: grid; place-items: center;
}
.suggest .rm:hover, .suggest .rm:focus-visible { background: rgba(255,255,255,.14); outline: 0; }
.suggest .rm svg { width: calc(56 * var(--u)); height: calc(56 * var(--u)); opacity: .6; }
@keyframes rise { from { opacity: 0; transform: translateY(calc(24 * var(--u))); } }

/* Search results (SearchResults.kt) */
.results {
  position: absolute; top: calc(208 * var(--u)); left: calc(80 * var(--u)); right: calc(80 * var(--u)); bottom: 0;
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  padding: calc(12 * var(--u)) 0 calc(48 * var(--u));
  box-sizing: border-box;
  -webkit-mask-image: linear-gradient(transparent, #000 calc(48 * var(--u)));
  mask-image: linear-gradient(transparent, #000 calc(48 * var(--u)));
}
.results::-webkit-scrollbar { display: none; }
.results > * + * { margin-top: calc(20 * var(--u)); }   /* 220 rows + 20 gaps: four fit */
.track {
  display: flex; align-items: center; gap: calc(48 * var(--u)); width: 100%;
  height: calc(220 * var(--u)); padding: 0 calc(16 * var(--u)); box-sizing: border-box;
  border: 0; border-radius: calc(28 * var(--u)); background: transparent; cursor: pointer;
  text-align: left; color: #fff; font-family: var(--font-app);
  animation: rise .32s var(--ease) both; animation-delay: calc(var(--i) * 50ms);
}
.track:hover, .track:focus-visible { background: rgba(255,255,255,.10); outline: 0; }
.track:active { background: rgba(255,255,255,.16); }
.thumb {
  flex: none; width: calc(348 * var(--u)); height: calc(196 * var(--u));
  border-radius: calc(22 * var(--u)); border: calc(1.5 * var(--u)) solid rgba(255,255,255,.18);
  box-sizing: border-box; position: relative; overflow: hidden;
}
.thumb span {   /* sample-art monogram */
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 700 calc(84 * var(--u)) var(--font-app); color: rgba(255,255,255,.85);
}
.meta { min-width: 0; display: grid; gap: calc(14 * var(--u)); }
.meta .t { font-size: calc(66 * var(--u)); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 8px rgba(0,0,0,.33); }
.meta .a { font-size: calc(46 * var(--u)); color: rgba(255,255,255,.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 8px rgba(0,0,0,.33); }
.skeleton { display: flex; align-items: center; gap: calc(48 * var(--u)); height: calc(220 * var(--u)); padding: 0 calc(16 * var(--u)); }
.skeleton i { display: block; background: rgba(255,255,255,.12); animation: pulse2 1.4s ease-in-out infinite alternate; }
.skeleton .sk-thumb { width: calc(348 * var(--u)); height: calc(196 * var(--u)); border-radius: calc(22 * var(--u)); flex: none; }
.skeleton .sk-lines { display: grid; gap: calc(26 * var(--u)); }
.skeleton .sk-1 { height: calc(50 * var(--u)); border-radius: calc(22 * var(--u)); }
.skeleton .sk-2 { width: calc(400 * var(--u)); height: calc(36 * var(--u)); border-radius: calc(16 * var(--u)); opacity: .7; }
@keyframes pulse2 { from { background: rgba(255,255,255,.08); } to { background: rgba(255,255,255,.18); } }
.msg { display: grid; justify-items: center; gap: calc(24 * var(--u)); padding: calc(200 * var(--u)) calc(120 * var(--u)) 0; text-align: center; }
.msg .t { font: 500 calc(64 * var(--u)) / 1.2 var(--font-app); color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.33); }
.msg .d { font: 400 calc(42 * var(--u)) / 1.3 var(--font-app); color: rgba(255,255,255,.72); }
.msg button {
  margin-top: calc(8 * var(--u)); height: calc(120 * var(--u)); padding: 0 calc(72 * var(--u));
  border-radius: 999px; cursor: pointer; color: #fff; font: 500 calc(46 * var(--u)) var(--font-app);
  background: linear-gradient(rgba(255,255,255,.19), rgba(255,255,255,.08));
  border: calc(1.5 * var(--u)) solid rgba(255,255,255,.14); border-top-color: rgba(255,255,255,.5);
}
.bounds .track, .bounds .thumb { outline: 1px dashed #00e5ff; }
.sel { font: 500 13px var(--font-app); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }

/* Player (PlayerOverlay.kt): dock at the bottom, Now Playing when expanded.
   Now Playing = artwork left, blurred artwork behind everything, controls right. */
.has-dock .results { bottom: calc(280 * var(--u)); }
.searching.has-dock:not(.kb-up) .suggest { padding-bottom: calc(304 * var(--u)); }
.np-backdrop {
  position: absolute; inset: 0; opacity: 0; pointer-events: none; overflow: hidden;
  background: #1a0508; transition: opacity .44s var(--ease);
}
.np-backdrop::before { content: ""; position: absolute; inset: -10%; background: var(--song, #1a0508); filter: blur(calc(60 * var(--u))) saturate(1.2); }
.np-backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.5)); }
.expanded .np-backdrop { opacity: 1; pointer-events: auto; }

.dock {
  position: absolute; left: 0; right: 0; top: calc(920 * var(--u)); height: calc(280 * var(--u));
  box-sizing: border-box; padding: 0 calc(64 * var(--u)) 0 calc(328 * var(--u));
  display: flex; align-items: center; gap: calc(40 * var(--u));
  border-radius: calc(56 * var(--u)) calc(56 * var(--u)) 0 0;
  background: linear-gradient(rgba(255,255,255,.19), rgba(255,255,255,.06)), rgba(48, 0, 8, .28);
  border: calc(2 * var(--u)) solid rgba(255,255,255,.14); border-top-color: rgba(255,255,255,.5); border-bottom: 0;
  -webkit-backdrop-filter: blur(calc(26 * var(--u))) saturate(1.3); backdrop-filter: blur(calc(26 * var(--u))) saturate(1.3);
  cursor: pointer;
  transition: transform .32s var(--ease), opacity .44s var(--ease);
}
.dock .bar-line { position: absolute; left: calc(56 * var(--u)); top: 0; height: calc(6 * var(--u)); background: var(--red); border-radius: 3px; width: 0; }
.dock .meta .t { font-size: calc(60 * var(--u)); }
.dock .meta .a { font-size: calc(44 * var(--u)); }
.dock .meta { flex: 1; }
.kb-up .dock { transform: translateY(calc(320 * var(--u))); }
.expanded .dock { opacity: 0; pointer-events: none; }

.ctrls { display: flex; align-items: center; gap: calc(32 * var(--u)); flex: none; }
.cbtn {
  width: var(--s); height: var(--s); border-radius: 50%; flex: none; padding: 0; cursor: pointer;
  display: grid; place-items: center;
  border: calc(1.5 * var(--u)) solid rgba(255,255,255,.14); border-top-color: rgba(255,255,255,.5);
  background: linear-gradient(rgba(255,255,255,.18), rgba(255,255,255,.08));
}
.cbtn svg { width: var(--g); height: var(--g); }
.cbtn.accent { background: var(--red); border-color: rgba(255,255,255,.25); }
.cbtn:disabled { opacity: .35; cursor: default; }
.cbtn:not(:disabled):active { transform: scale(.94); }
.cbtn:focus-visible, .glyph:focus-visible, .tile:focus-visible { outline: calc(4 * var(--u)) solid #fff; outline-offset: calc(3 * var(--u)); }

/* Artwork square (YouTube player sits right behind it) */
.art {
  position: absolute; left: calc(56 * var(--u)); top: calc(948 * var(--u));
  width: calc(224 * var(--u)); height: calc(224 * var(--u));
  border-radius: calc(28 * var(--u)); overflow: hidden; background: #000;
  border: calc(1.5 * var(--u)) solid rgba(255,255,255,.3);
  transition-property: left, top, width, height, border-radius, transform;
  transition-duration: .44s, .44s, .44s, .44s, .44s, .32s; transition-timing-function: var(--ease);
  cursor: pointer;
}
.kb-up:not(.expanded) .art { transform: translateY(calc(320 * var(--u))); }
.expanded .art { left: calc(96 * var(--u)); top: calc(210 * var(--u)); width: calc(600 * var(--u)); height: calc(600 * var(--u)); border-radius: calc(40 * var(--u)); box-shadow: 0 calc(30 * var(--u)) calc(80 * var(--u)) rgba(0,0,0,.35); }
.art .cover { position: absolute; inset: 0; transition: opacity .3s; }
.art .cover span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 calc(220 * var(--u)) var(--font-app); color: rgba(255,255,255,.85); transition: font-size .44s var(--ease); }
.art:not(.big) .cover span { font-size: calc(90 * var(--u)); }

.np { opacity: 0; pointer-events: none; transition: opacity .44s var(--ease); color: #fff; }
.expanded .np { opacity: 1; pointer-events: auto; }

.np-where {
  position: absolute; right: calc(64 * var(--u)); top: calc(82 * var(--u)); max-width: calc(900 * var(--u));
  font-size: calc(44 * var(--u)); color: rgba(255,255,255,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 2px 10px rgba(0,0,0,.4);
}

  position: absolute; left: calc(792 * var(--u)); right: calc(96 * var(--u));
  top: calc(210 * var(--u)); height: calc(600 * var(--u)); padding: calc(10 * var(--u)) 0 calc(30 * var(--u)); box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  transform: translateX(calc(60 * var(--u))); transition: transform .44s var(--ease);
}
.expanded .np-col { transform: none; }
.np-title { font: 600 calc(88 * var(--u)) / 1.14 var(--font-app); padding-bottom: .06em; text-shadow: 0 2px 10px rgba(0,0,0,.4);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.np-artist { margin-top: calc(14 * var(--u)); font-size: calc(56 * var(--u)); color: rgba(255,255,255,.78); max-width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
.np-grow { flex: 1; }
.transport { display: flex; align-items: center; gap: calc(150 * var(--u)); }
.glyph { width: var(--s); height: var(--s); border-radius: 50%; border: 0; padding: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
.glyph svg { width: var(--g); height: var(--g); filter: drop-shadow(0 2px 8px rgba(0,0,0,.3)); }

.seekrow { position: absolute; left: calc(96 * var(--u)); right: calc(96 * var(--u)); top: calc(862 * var(--u)); display: flex; align-items: center; font-size: calc(42 * var(--u)); font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
.seekrow #tPos { width: calc(120 * var(--u)); text-align: left; }

.tiles { position: absolute; left: 0; right: 0; top: calc(1006 * var(--u)); display: flex; justify-content: center; gap: calc(48 * var(--u)); }

  /* off: just the icon; on: glass box + bolder icon */

  display: grid; place-items: center;

.bounds .art, .bounds .dock, .bounds .cbtn, .bounds .np-col, .bounds .glyph, .bounds .tile { outline: 1px dashed #00e5ff; }

/* Glass keyboard (GlassKeyboard.kt) */
.kb {
  position: absolute; left: 0; right: 0; bottom: 0; height: calc(540 * var(--u));
  box-sizing: border-box;
  padding: calc(26 * var(--u)) calc(96 * var(--u)) calc(30 * var(--u));
  display: grid; grid-template-rows: repeat(4, 1fr); gap: calc(16 * var(--u));
  border-radius: calc(56 * var(--u)) calc(56 * var(--u)) 0 0;

    linear-gradient(rgba(255,255,255,.19), rgba(255,255,255,.06)),
    rgba(48, 0, 8, .28);
  border: calc(2 * var(--u)) solid rgba(255,255,255,.40); border-bottom: 0;
  -webkit-backdrop-filter: blur(calc(26 * var(--u))) saturate(1.3);
  backdrop-filter: blur(calc(26 * var(--u))) saturate(1.3);

}

.kb-row { display: flex; gap: calc(16 * var(--u)); min-height: 0; }
.kb-gap { flex: .5; }

  flex: var(--w, 1); min-width: 0; border-radius: calc(26 * var(--u));
  /* mostly clear glass; the edge catches light at the top and fades out */
  border: calc(1.5 * var(--u)) solid rgba(255,255,255,.14);
  border-top-color: rgba(255,255,255,.42);
  background: linear-gradient(rgba(255,255,255,.13), rgba(255,255,255,.04));
  box-shadow: inset 0 calc(1.5 * var(--u)) 0 rgba(255,255,255,.18);
  color: #fff; font: 400 calc(56 * var(--u)) / 1 var(--font-app);
  text-shadow: 0 1px 6px rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: center; gap: calc(16 * var(--u));
  cursor: pointer; padding: 0;
  transition: transform .09s, background .09s;
  touch-action: manipulation;
}
.key.small { font-size: calc(44 * var(--u)); font-weight: 500; }

<script>
const $ = (id) => document.getElementById(id);
const screen = $('screen'), field = $('field'), sugEl = $('suggest'), kbEl = $('kb');
const clearBtn = $('clear'), catcher = $('catcher'), log = $('log'), toastEl = $('toast'), voice = $('voice');

// ---------- Debug log ----------
function logEvent(name, detail = '') {
  const li = document.createElement('li');
  li.innerHTML = `<time></time><span class="ev"></span> <span class="d"></span>`;
  li.querySelector('time').textContent = new Date().toLocaleTimeString([], { hour12: false });
  li.querySelector('.ev').textContent = name;
  li.querySelector('.d').textContent = detail;
  log.appendChild(li);
  log.scrollTop = log.scrollHeight;
}
let toastTimer;
function toast(msg) {          // Toast.LENGTH_SHORT ≈ 2s
  toastEl.textContent = msg;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2000);
}

// ---------- Suggestions: same logic as LocalSuggestionProvider.kt ----------
const CATALOGUE = ["Taylor Swift","Taylor Swift Cruel Summer","Taylor Swift Anti-Hero","The Weeknd","The Weeknd Blinding Lights","The Weeknd Save Your Tears","The Weeknd Starboy","Drake","Drake One Dance","Drake God's Plan","Billie Eilish","Billie Eilish Birds of a Feather","Billie Eilish Lovely","Sabrina Carpenter Espresso","Sabrina Carpenter Please Please Please","Kendrick Lamar","Kendrick Lamar Not Like Us","Kendrick Lamar Humble","SZA","SZA Kill Bill","SZA Saturn","Bad Bunny","Bad Bunny Tití Me Preguntó","Dua Lipa","Dua Lipa Levitating","Dua Lipa Houdini","Ed Sheeran Shape of You","Ed Sheeran Perfect","Harry Styles As It Was","Harry Styles Watermelon Sugar","Post Malone","Post Malone Circles","Post Malone Sunflower","Olivia Rodrigo","Olivia Rodrigo Drivers License","Olivia Rodrigo Vampire","Arctic Monkeys Do I Wanna Know","Arctic Monkeys 505","Coldplay","Coldplay Yellow","Coldplay Viva La Vida","Imagine Dragons Believer","Imagine Dragons Thunder","Travis Scott","Travis Scott Sicko Mode","Bruno Mars","Bruno Mars Uptown Funk","Bruno Mars Die With A Smile","Lady Gaga","Chappell Roan Good Luck Babe","Chappell Roan Pink Pony Club","Hozier Too Sweet","Benson Boone Beautiful Things","Queen Bohemian Rhapsody","Michael Jackson Billie Jean","Fleetwood Mac Dreams","Eagles Hotel California","Daft Punk Get Lucky","Frank Ocean","Frank Ocean Pink + White","Tame Impala The Less I Know The Better","Mac Miller","Lofi hip hop radio","Lofi beats to study to","Road trip playlist","Driving music","Chill vibes playlist","Workout music","Top hits 2026","Throwback hits","90s hip hop","80s rock"];
const SUFFIXES = ["songs","live","remix","playlist","acoustic","lyrics","slowed","sped up","instrumental","mix","cover","karaoke","audio","official video"];
const MAX_SUGGESTIONS = 14, DEBOUNCE_MS = 120;

function suggest(query, limit) {
  const qq = query.trim().toLowerCase();
  if (!qq) return [];
  const starts = CATALOGUE.filter(e => e.toLowerCase().startsWith(qq));
  const words = CATALOGUE.filter(e => !starts.includes(e) &&
    e.toLowerCase().split(/[ \-(]/).some(w => w.startsWith(qq)));
  const out = [...starts, ...words].map(e => e.toLowerCase()).concat(SUFFIXES.map(x => `${qq} ${x}`));
  return [...new Set(out)].slice(0, limit);
}

// ---------- Sample results (the demo can't reach YouTube from the browser) ----------
// Built from the same catalogue so results make sense for what you typed.
const ARTISTS = ["Taylor Swift","The Weeknd","Drake","Billie Eilish","Sabrina Carpenter","Kendrick Lamar","SZA","Bad Bunny","Dua Lipa","Ed Sheeran","Harry Styles","Post Malone","Olivia Rodrigo","Arctic Monkeys","Coldplay","Imagine Dragons","Travis Scott","Bruno Mars","Lady Gaga","Chappell Roan","Hozier","Benson Boone","Queen","Michael Jackson","Fleetwood Mac","Eagles","Daft Punk","Frank Ocean","Tame Impala","Mac Miller"];
function splitEntry(e) {
  const a = ARTISTS.find(x => e.toLowerCase().startsWith(x.toLowerCase() + ' '));
  return a ? { title: e.slice(a.length + 1), artist: a } : null;
}
function hash(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function sampleResults(q) {
  const qq = q.toLowerCase();
  const songs = CATALOGUE.map(splitEntry).filter(Boolean);
  const hits = songs.filter(s => `${s.artist} ${s.title}`.toLowerCase().includes(qq) ||
    qq.split(' ').some(w => w.length > 2 && `${s.artist} ${s.title}`.toLowerCase().includes(w)));
  // Nothing in the small sample list? Make placeholder rows from the query itself,
  // so every search shows something. (The real app gets these from YouTube.)
  const titled = q.trim().replace(/\b\w/g, c => c.toUpperCase());
  const base = hits.length ? hits : [
    { title: titled, artist: 'Sample result' },
    { title: `${titled} (Remix)`, artist: 'Sample result' },
    { title: `${titled} (Acoustic)`, artist: 'Sample result' },
  ];
  const out = [];
  base.forEach(s => {
    out.push(s);
    out.push({ title: `${s.title} (Live)`, artist: s.artist });
  });
  return out.slice(0, 12).map(s => {
    const h = hash(s.artist + s.title);
    return { ...s, duration: `${2 + h % 3}:${String(h % 60).padStart(2, '0')}`, hue: h % 360 };
  });
}

// ---------- Search history (mirrors SearchHistory.kt; saved in this browser) ----------
const HISTORY_KEY = 'muz.searchHistory', MAX_HISTORY = 30, MAX_HISTORY_WHILE_TYPING = 2;
function loadHistory() {
  try { const v = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); return Array.isArray(v) ? v : []; }
  catch { return []; }
}
function saveHistory(list) { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch {} }
let recent = loadHistory();
function addHistory(q) {
  q = q.trim(); if (!q) return;
  recent = [q, ...recent.filter(h => h.toLowerCase() !== q.toLowerCase())].slice(0, MAX_HISTORY);
  saveHistory(recent);
}
function removeHistory(q) {
  recent = recent.filter(h => h.toLowerCase() !== q.toLowerCase());
  saveHistory(recent);
  logEvent('history:remove', JSON.stringify(q));
  render();
}
function matchingHistory(typed) {
  const t = typed.trim().toLowerCase();
  const same = h => h.toLowerCase() === t;
  const starts = recent.filter(h => h.toLowerCase().startsWith(t) && !same(h));
  const words = recent.filter(h => !starts.includes(h) && !same(h) && h.toLowerCase().split(' ').some(w => w.startsWith(t)));
  return [...starts, ...words];
}
function listItems() {
  if (!query.trim()) return recent.slice(0, 30).map(text => ({ text, hist: true }));   // all of it, scrollable
  const past = matchingHistory(query).slice(0, MAX_HISTORY_WHILE_TYPING);
  const fresh = suggestions.filter(s => !past.some(p => p.toLowerCase() === s.toLowerCase()));
  return [...past.map(text => ({ text, hist: true })), ...fresh.map(text => ({ text, hist: false }))].slice(0, MAX_SUGGESTIONS);
}

// ---------- State (mirrors HomeScreen.kt) ----------
let query = '', open = false, keyboard = false, suggestions = [];
let submitted = null, results = { kind: 'loading' }, searchTimer;
const searching = () => open || query.length > 0 || submitted !== null;
const showResults = () => submitted !== null && !open;
const keyboardShown = () => open && keyboard;

let debounce, wasSearching = false, wasKb = false;
function setQuery(v) {
  if (v === query) return;
  query = v;
  clearTimeout(debounce);
  if (!query.trim()) suggestions = [];
  else debounce = setTimeout(() => {
    suggestions = suggest(query, MAX_SUGGESTIONS);
    logEvent('suggest', `${JSON.stringify(query)} → ${suggestions.length}`);
    render();
  }, DEBOUNCE_MS);
  render();
}
function activate() {
  open = true; keyboard = true;
  if (query.trim() && !suggestions.length) suggestions = suggest(query, MAX_SUGGESTIONS);
  render();
}
function runSearch() {          // LaunchedEffect(submitted, attempt)
  const q = submitted;
  results = { kind: 'loading' };
  renderResults();
  logEvent('youtube.search', JSON.stringify(q));
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const mode = $('mode').value;
    if (mode === 'ok') {
      const tracks = sampleResults(q);
      results = { kind: 'done', query: q, tracks };
      logEvent('result', `${tracks.length} sample songs`);
    } else if (mode === 'empty') {
      results = { kind: 'done', query: q, tracks: [] };
      logEvent('result', '0 songs');
    } else {
      results = { kind: 'failed', reason: mode };
      logEvent('result', `Failure(${mode})`);
    }
    renderResults();
  }, 700);
}
function submit(text) {
  query = text; open = false; keyboard = false; submitted = text;
  clearTimeout(debounce);
  addHistory(text);
  runSearch();
  render();
}
function closePanel() {
  open = false; keyboard = false;
  if (submitted !== null) query = submitted;
}
function tapOutside() {
  if (!open) return;
  if (keyboard && query) { keyboard = false; logEvent('tap', 'outside → hide keyboard'); }
  else { closePanel(); logEvent('tap', 'outside → close panel'); }
  render();
}
function back() {
  if (open && submitted !== null) { closePanel(); logEvent('back', 'panel → results'); }

    clearTimeout(searchTimer);

  }

}
// ---------- Player (mirrors PlayerController.kt; playback is simulated here) ----------
const P = { queue: [], original: [], name: null, index: -1, playing: false, pos: 0, dur: 0,
            expanded: false, shuffle: false, loop: false, wrap: false, timer: null };
const PICON = { play: "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8.5 5.3c0-.8.9-1.3 1.6-.9l9.3 5.9c.7.4.7 1.5 0 1.9l-9.3 5.9c-.7.4-1.6-.1-1.6-.9z\" fill=\"#fff\"/></svg>", pause: "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 4.5h2.6a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1zM14.4 4.5H17a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-2.6a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1z\" fill=\"#fff\"/></svg>" };
const cur = () => P.queue[P.index];
// wrap = start over after the last song (libraries / playlists); search results don't.
const hasNext = () => P.index < P.queue.length - 1 || (P.wrap && P.queue.length > 0);
const toSec = d => { const [m, s] = d.split(':').map(Number); return m * 60 + s; };
const fmt = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function playQueue(tracks, i, name) {
  P.original = tracks; P.name = name; P.expanded = true;
  if (P.shuffle) { const first = tracks[i]; P.queue = [first, ...shuffled(tracks.filter(t => t !== first))]; i = 0; }
  else P.queue = tracks;

  playAt(i);
}
function playAt(i) {
  P.index = i; P.pos = 0; P.dur = toSec(cur().duration); P.playing = true;
  logEvent('player.load', `${JSON.stringify(cur().title)} – ${cur().artist}`);
  tick(); renderPlayer();
}
function tick() {

  P.timer = setInterval(() => {
    if (!P.playing) return;
    P.pos += 0.25;
    if (P.pos >= P.dur) {                               // STATE_ENDED
      if (P.loop) { P.pos = 0; logEvent('player.ended', 'loop this song'); }
      else if (hasNext()) { logEvent('player.ended', 'next in queue'); next(); return; }
      else { P.pos = P.dur; P.playing = false; logEvent('player.ended', 'end of queue'); renderPlayer(); }
    }

}
function togglePlay() { P.playing = !P.playing; logEvent('player', P.playing ? 'play' : 'pause'); renderPlayer(); }
function next() {
  if (P.index < P.queue.length - 1) playAt(P.index + 1);
  else if (P.wrap && P.queue.length) playAt(0);
}
function previous() { if (P.pos > 3 || P.index === 0) { P.pos = 0; logEvent('player', 'restart'); renderProgress(); } else playAt(P.index - 1); }
function toggleShuffle() {
  const now = cur(); P.shuffle = !P.shuffle;
  if (P.shuffle) { P.queue = [now, ...shuffled(P.original.filter(t => t !== now))]; P.index = 0; }
  else { P.queue = P.original; P.index = Math.max(0, P.original.indexOf(now)); }
  logEvent('player', `shuffle ${P.shuffle ? 'on' : 'off'}`); renderPlayer();
}
function toggleLoop() { P.loop = !P.loop; logEvent('player', `loop this song ${P.loop ? 'on' : 'off'}`); renderPlayer(); }
function setExpanded(v) { P.expanded = v; logEvent('player', v ? 'expand' : 'minimize'); renderPlayer(); }
// ⌄ / Back on Now Playing: minimize to the dock AND go back to the "Listen..." home.
function minimizeToHome() {
  setExpanded(false);
  query = ''; open = false; keyboard = false; suggestions = []; submitted = null;
  clearTimeout(searchTimer);
  logEvent('home', 'back to Listen…');
  render();
}
// Search results play as a plain queue: no library/playlist name, so no "3 of 20".
function play(t) { playQueue(results.tracks, results.tracks.indexOf(t), null); }

const playerEl = $('player');
function renderProgress() {
  const f = P.dur ? Math.min(1, P.pos / P.dur) : 0;
  $('dockLine').style.width = `calc(${f} * (100% - 112 * var(--u)))`;
  if (!seekDrag) {
    $('seekFill').style.width = `${f * 100}%`;
    $('tPos').textContent = fmt(P.pos);
    $('tLeft').textContent = '-' + fmt(P.dur - P.pos);
  }
}
function renderPlayer() {
  const t = cur();
  playerEl.hidden = !t;
  screen.classList.toggle('has-dock', !!t);
  screen.classList.toggle('expanded', !!t && P.expanded);
  if (!t) return;
  $('dockTitle').textContent = $('npTitle').textContent = t.title;
  $('dockArtist').textContent = $('npArtist').textContent = t.artist;
  $('npWhere').hidden = !P.name;   // only for libraries / playlists
  if (P.name) $('npWhere').textContent = `${P.name} — ${P.index + 1} of ${P.queue.length}`;
  const art = `linear-gradient(135deg, hsl(${t.hue} 70% 45%), hsl(${(t.hue + 50) % 360} 75% 30%))`;
  $('cover').style.background = art;
  $('cover').firstChild.textContent = t.artist[0];
  $('npBackdrop').style.setProperty('--song', art);
  $('art').classList.toggle('big', P.expanded);
  playerEl.querySelectorAll('[data-act="toggle"]').forEach(b => {
    b.innerHTML = P.playing ? PICON.pause : PICON.play; b.setAttribute('aria-label', P.playing ? 'Pause' : 'Play');
  });
  playerEl.querySelectorAll('[data-act="next"]').forEach(b => { b.disabled = !hasNext(); });
  const sh = playerEl.querySelector('[data-act="shuffle"]');
  sh.classList.toggle('on', P.shuffle); sh.setAttribute('aria-pressed', P.shuffle);
  const rp = playerEl.querySelector('[data-act="repeat"]');
  rp.classList.toggle('on', P.loop); rp.setAttribute('aria-pressed', P.loop);
  renderProgress();
}
playerEl.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (b) {
    e.stopPropagation();
    ({ prev: previous, next, toggle: togglePlay, min: minimizeToHome,
       shuffle: toggleShuffle, repeat: toggleLoop,
       add: () => { logEvent('player', 'add to library (coming later)'); toast('Libraries are coming soon'); },
    })[b.dataset.act]();
    return;
  }
  if (e.target.closest('.art')) {
    if (!P.expanded) setExpanded(true);
    return;
  }
  if (!P.expanded && e.target.closest('.dock')) setExpanded(true);
});
// Seek: tap or drag along the bar
let seekDrag = false;
const seekEl = $('seek');
function seekFrac(e) { const r = seekEl.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); }
function showSeek(f) { $('seekFill').style.width = `${f * 100}%`; $('tPos').textContent = fmt(f * P.dur); $('tLeft').textContent = '-' + fmt(P.dur - f * P.dur); }
seekEl.addEventListener('pointerdown', (e) => {
  seekDrag = true; seekEl.classList.add('drag'); seekEl.setPointerCapture(e.pointerId); showSeek(seekFrac(e));
});
seekEl.addEventListener('pointermove', (e) => { if (seekDrag) showSeek(seekFrac(e)); });
seekEl.addEventListener('pointerup', (e) => {
  if (!seekDrag) return;
  seekDrag = false; seekEl.classList.remove('drag');
  P.pos = seekFrac(e) * P.dur; logEvent('player.seek', fmt(P.pos)); renderProgress();
});

const MESSAGES = {
  MissingKey: ['Add a YouTube API key to search', 'Put youtube.apiKey=… in local.properties, then rebuild. See the README.'],
  BadKey: ["YouTube didn't accept the API key", 'Check the key, and that YouTube Data API v3 is enabled for it.'],
  QuotaExceeded: ['Search limit reached for today', "YouTube's free search allowance resets at midnight Pacific time."],
  Offline: ['No internet connection', "Check the headunit's Wi-Fi or phone hotspot, then try again.", true],
  Other: ["Couldn't search YouTube", "Something went wrong on YouTube's side.", true],
};
const resultsEl = $('results');
function message(title, detail, retry) {
  const m = document.createElement('div'); m.className = 'msg';
  const t = document.createElement('div'); t.className = 't'; t.textContent = title;
  const d = document.createElement('div'); d.className = 'd'; d.textContent = detail;
  m.append(t, d);
  if (retry) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Try again';
    b.addEventListener('click', () => { logEvent('retry', ''); runSearch(); });
    m.append(b);
  }
  return m;
}
function renderResults() {
  resultsEl.hidden = !showResults();
  resultsEl.textContent = '';
  if (results.kind === 'loading') {
    for (let i = 0; i < 5; i++) {
      const r = document.createElement('div'); r.className = 'skeleton'; r.style.opacity = 1 - i * .15;
      r.innerHTML = `<i class="sk-thumb"></i><div class="sk-lines"><i class="sk-1" style="width:calc(${720 - i * 60} * var(--u))"></i><i class="sk-2"></i></div>`;
      resultsEl.append(r);
    }
  } else if (results.kind === 'failed') {
    const [t, d, retry] = MESSAGES[results.reason];
    resultsEl.append(message(t, d, retry));
  } else if (!results.tracks.length) {
    resultsEl.append(message(`No songs found for “${results.query}”`, "Try a different spelling or the artist's name."));
  } else {
    results.tracks.forEach((tr, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'track';
      b.style.setProperty('--i', Math.min(i, 6));
      const th = document.createElement('div'); th.className = 'thumb';
      th.style.background = `linear-gradient(135deg, hsl(${tr.hue} 70% 45%), hsl(${(tr.hue + 50) % 360} 75% 30%))`;
      const mono = document.createElement('span'); mono.textContent = tr.artist[0]; th.append(mono);
      const meta = document.createElement('div'); meta.className = 'meta';
      const t = document.createElement('div'); t.className = 't'; t.textContent = tr.title;
      const a = document.createElement('div'); a.className = 'a'; a.textContent = `${tr.artist}  ·  ${tr.duration}`;
      meta.append(t, a);

}

// ---------- Render ----------
const caret = document.createElement('span'); caret.className = 'caret';
function renderField() {
  field.textContent = '';
  const active = keyboardShown() || !searching();
  // restart the blink so it stays solid right after a keystroke
  caret.classList.remove('on'); void caret.offsetWidth; caret.classList.toggle('on', active);
  if (!query) { field.append(caret, 'Search'); field.classList.remove('long'); }
  else {
    field.append(query, caret);
    field.classList.toggle('long', field.scrollWidth > field.clientWidth);
  }
}
const SUG_ICON = {
  hist: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 12a8.2 8.2 0 1 0 2.4-5.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M6.2 2.8v3.6h3.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7.5V12l3 2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  sug: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M16 16l5.5 5.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>',
  rm: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
};
function renderSuggestions() {
  const list = open ? listItems() : [];
  sugEl.hidden = list.length === 0;          // don't block taps when there's nothing to show
  const typed = query.trim();
  const blank = !typed;
  if (blank !== renderSuggestions.wasBlank) sugEl.scrollTop = 0;   // switching history ↔ suggestions
  renderSuggestions.wasBlank = blank;
  const keyOf = it => `${it.hist ? 'h' : 's'}:${it.text}`;
  const old = new Map([...sugEl.children].map(li => [li.dataset.key, li]));
  sugEl.textContent = '';

    let li = old.get(keyOf(it));
    if (!li) {
      li = document.createElement('li');
      li.dataset.key = keyOf(it);
      if (it.hist) li.className = 'hist';
      li.style.setProperty('--i', i);
      const pick = document.createElement('button');
      pick.type = 'button'; pick.className = 'pick';
      pick.innerHTML = `<span class="ico">${it.hist ? SUG_ICON.hist : SUG_ICON.sug}</span><span class="txt"></span>`;
      pick.addEventListener('click', () => {
        logEvent(it.hist ? 'history:pick' : 'suggestion:pick', JSON.stringify(it.text)); submit(it.text);
      });

        rm.type = 'button'; rm.className = 'rm'; rm.setAttribute('aria-label', 'Remove from recent searches');

}
function render() {
  const s = searching(), k = keyboardShown();
  if (s !== wasSearching) logEvent('mode', s ? 'search' : 'idle');
  if (k !== wasKb) logEvent('keyboard', k ? 'up' : 'down');
  wasSearching = s; wasKb = k;
  screen.classList.toggle('searching', s);
  kbEl.classList.toggle('up', k);
  screen.classList.toggle('kb-up', k);
  kbEl.inert = !k;
  catcher.hidden = !s;
  clearBtn.hidden = !query;
  renderField();
  renderSuggestions();
  const wasHidden = resultsEl.hidden;
  resultsEl.hidden = !showResults();

// ---------- Glass keyboard ----------
const ICON = {
  back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 5.5H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8.2a1.5 1.5 0 0 1-1.1-.5l-4.5-5.5a.8.8 0 0 1 0-1L7.1 6a1.5 1.5 0 0 1 1.1-.5z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M11.5 9.5l5 5M16.5 9.5l-5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
  hide: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  search: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M16 16l5.5 5.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>',
};
const PAGES = {
  letters: ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'],
  symbols: ['1234567890', '-/:;()$&@"', ".,?!'#+"],
};
let symbols = false;

function type(c) {
  if (c === ' ' && (!query || query.endsWith(' '))) return;   // no leading/double spaces
  setQuery(query + c);
}
function backspace() { if (query) setQuery(query.slice(0, -1)); }

function makeKey({ label, html, w = 1, cls = '', act, repeat = false }) {
  const k = document.createElement('button');
  k.type = 'button';
  k.className = `key ${cls}`;
  k.style.setProperty('--w', w);
  k.setAttribute('aria-label', label);
  if (html) k.innerHTML = html; else k.textContent = label;
  let holdTimer, repeatTimer;
  const stop = () => { k.classList.remove('pressed'); clearTimeout(holdTimer); clearInterval(repeatTimer); };
  k.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    k.setPointerCapture(e.pointerId);
    k.classList.add('pressed');
    if (repeat) {           // backspace: fire now, repeat while held
      act();
      holdTimer = setTimeout(() => { repeatTimer = setInterval(act, 60); }, 450);
    }
  });
  k.addEventListener('pointerup', (e) => {
    const inside = document.elementFromPoint(e.clientX, e.clientY)?.closest('.key') === k;

}
function buildKeyboard() {
  kbEl.textContent = '';
  const [r1, r2, r3] = symbols ? PAGES.symbols : PAGES.letters;
  const row = () => { const r = document.createElement('div'); r.className = 'kb-row'; kbEl.appendChild(r); return r; };
  const gap = () => { const g = document.createElement('span'); g.className = 'kb-gap'; return g; };
  const char = (c) => makeKey({ label: c, act: () => type(c) });

  const a = row(); [...r1].forEach(c => a.appendChild(char(c)));
  const b = row(); if (r2.length < 10) b.appendChild(gap());
  [...r2].forEach(c => b.appendChild(char(c))); if (r2.length < 10) b.appendChild(gap());
  const c = row();
  c.appendChild(makeKey({ label: symbols ? 'abc' : '123', w: 1.5, cls: 'small',
    act: () => { symbols = !symbols; buildKeyboard(); } }));
  [...r3].forEach(ch => c.appendChild(char(ch)));
  c.appendChild(makeKey({ label: 'Delete', html: ICON.back, w: 1.5, act: backspace, repeat: true }));
  const d = row();
  d.appendChild(makeKey({ label: 'Hide keyboard', html: ICON.hide, w: 1.5,
    act: () => { keyboard = false; render(); } }));
  d.appendChild(char(','));
  d.appendChild(makeKey({ label: 'space', w: 4.5, cls: 'small faded', act: () => type(' ') }));
  d.appendChild(char('.'));
  d.appendChild(makeKey({ label: 'Search', html: `${ICON.search}<span>Search</span>`, w: 2, cls: 'small accent',
    act: () => { if (query.trim()) submit(query.trim()); } }));
}
buildKeyboard();

// Computer keyboard works too while ours is up (handy for testing).
document.addEventListener('keydown', (e) => {
  if (!voice.hidden || e.target.closest?.('.btn, .voice')) return;
  if (e.key === 'Escape') {
    if (P.expanded && cur()) minimizeToHome();       // player's BackHandler wins
    else if (searching()) back();
    return;
  }
  if (!keyboardShown()) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (query.trim()) submit(query.trim()); }
  else if (e.key.length === 1) { e.preventDefault(); type(e.key.toLowerCase()); }
});

// ---------- Wiring ----------
$('bar').addEventListener('click', (e) => {
  if (e.target.closest('.mic, .clear')) return;
  activate();
});
clearBtn.addEventListener('click', () => { setQuery(''); activate(); logEvent('clear', 'query cleared'); });
catcher.addEventListener('click', tapOutside);
// The scrolling list covers the screen; taps between/below rows count as empty space.
sugEl.addEventListener('click', (e) => { if (e.target === sugEl) tapOutside(); });
// Scrolling the list (wheel or finger) puts the keyboard away, like onUserScroll in the app.
function scrollHidesKeyboard() {
  if (!keyboardShown()) return;
  keyboard = false; logEvent('keyboard', 'hidden by scrolling the list'); render();
}
sugEl.addEventListener('wheel', scrollHidesKeyboard, { passive: true });
sugEl.addEventListener('touchmove', scrollHidesKeyboard, { passive: true });

$('mic').addEventListener('click', () => {
  logEvent('onVoiceSearch', 'RecognizerIntent.ACTION_RECOGNIZE_SPEECH');
  voice.hidden = false;
  $('spoken').value = '';
  $('spoken').focus();
});

  voice.hidden = true;
  logEvent('voice:result', 'cancelled (RESULT_CANCELED)');
});

  e.preventDefault();
  const said = $('spoken').value.trim();
  voice.hidden = true;
  if (!said) { logEvent('voice:result', 'no speech'); return; }
  logEvent('voice:result', JSON.stringify(said));
  submit(said);
});

$('boundsBtn').addEventListener('click', (e) => {
  const on = $('wrap').classList.toggle('bounds');
  e.currentTarget.setAttribute('aria-pressed', on);
  logEvent('debug', `layout bounds ${on ? 'on' : 'off'}`);
});
$('fsBtn').addEventListener('click', async () => {
  try { await screen.requestFullscreen(); }
  catch { logEvent('debug', 'fullscreen not available in this view'); }
});
$('resetBtn').addEventListener('click', () => {
  query = ''; open = false; keyboard = false; suggestions = []; symbols = false;
  submitted = null; clearTimeout(searchTimer); voice.hidden = true; toastEl.hidden = true;
  clearInterval(P.timer); Object.assign(P, { queue: [], index: -1, playing: false, expanded: false }); renderPlayer();
  buildKeyboard();
  log.textContent = '';
  wasSearching = wasKb = false;
  logEvent('app', 'MainActivity.onCreate → HomeScreen');
  render();
});

function updateScale() {
  $('scale').textContent = `${(screen.getBoundingClientRect().width / 2000 * 100).toFixed(1)}%`;
}
new ResizeObserver(updateScale).observe(screen);
updateScale();
logEvent('app', 'MainActivity.onCreate → HomeScreen');
render();
