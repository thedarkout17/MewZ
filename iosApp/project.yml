# The iPhone app's Xcode project, described for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# CI turns this into MewZ.xcodeproj; on a Mac you can do the same:
#   brew install xcodegen && cd iosApp && xcodegen && open MewZ.xcodeproj
#
# Almost all of the app is Kotlin (../phone), compiled into the MewZPhone framework by the
# "Compile Kotlin" step below. The Swift here only starts it.
name: MewZ
options:
  bundleIdPrefix: com.headunit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "1"
    # Filled in by CI from the YOUTUBE_API_KEY secret (optional: the app can also take a pasted key).
    YOUTUBE_API_KEY: ""

targets:
  MewZ:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: MewZ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Portrait only.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # Keeps playing with the screen locked or another app open.
        UIBackgroundModes:
          - audio
        # White status bar text over the red background.
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        # Smooth 120 Hz scrolling on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        YouTubeApiKey: $(YOUTUBE_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.headunit.music.phone
        PRODUCT_NAME: MewZ
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        # The Kotlin framework built by the step below.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../phone/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework MewZPhone"
        # Gradle needs to read and write outside the Xcode sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
    preBuildScripts:
      - name: Compile Kotlin
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :phone:embedAndSignAppleFrameworkForXcode
