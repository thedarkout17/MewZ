# Builds both apps on GitHub's machines (free for public repos), so no Mac is needed.
#
#  - android: the headunit app, the shared core's tests, and the iPhone screens rendered
#    to pictures (phone/src/desktopTest). Outputs go to the draft release "ci-android".
#  - ios: the iPhone app, on a Mac, as an unsigned MewZ.ipa on the draft release "ios-app".
#    Install it with Sideloadly or AltStore (see docs/IPHONE.md); they sign it with your Apple ID.
#
# Optional secret YOUTUBE_API_KEY (Settings → Secrets and variables → Actions) is built
# into the iPhone app; without it, the app asks you to paste a key the first time you search.
name: Build

on:
  push:
    branches: [main, cleanup, ios]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Headunit app, tests, iPhone screen previews
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        shell: bash
        run: |
          ./gradlew --no-daemon --continue \
            :shared:jvmTest :shared:testDebugUnitTest \
            :app:assembleDebug \
            :phone:desktopTest 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Compile the iPhone code on Linux (quick check before the Mac build; informational)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew --no-daemon -Pkotlin.native.enableKlibsCrossCompilation=true :phone:compileKotlinIosArm64 2>&1 | tee ios-klib.log
          exit ${PIPESTATUS[0]}

      - name: Live YouTube check (from GitHub's network; informational)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew --no-daemon :phone:desktopTest --tests '*LiveYouTubeTest*' -Plive --rerun 2>&1 | tee live.log
          exit ${PIPESTATUS[0]}

      - name: Report
        if: always()
        run: |
          python3 .github/scripts/report.py build.log "Build"
          python3 .github/scripts/report.py build.log "Results" notice
          python3 .github/scripts/report.py live.log "Live YouTube" notice
          python3 .github/scripts/report.py ios-klib.log "iOS compile on Linux"

      - name: Publish outputs (draft release ci-android)
        if: always()
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MewZ-headunit-debug.apk 2>/dev/null || true
          bash .github/scripts/publish.sh ci-android "Headunit debug APK, iPhone screen previews and logs" \
            MewZ-headunit-debug.apk build/screenshots/*.png build.log live.log

  ios:
    name: iPhone app (.ipa)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tools
        run: |
          brew install xcodegen
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"

      - name: Shared core tests on the iPhone simulator
        shell: bash
        run: |
          ./gradlew --no-daemon :shared:iosSimulatorArm64Test \
            :phone:iosSimulatorArm64Test --tests 'com.headunit.music.phone.flow.*' 2>&1 | tee ios-tests.log
          exit ${PIPESTATUS[0]}

      - name: Diagnose old iPhone calls (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew --no-daemon :phone:iosSimulatorArm64Test --tests 'com.headunit.music.phone.diag.*' 2>&1 | tee ios-diag.log
          exit ${PIPESTATUS[0]}

      - name: Build the app
        if: ${{ !cancelled() }}
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          cd iosApp && xcodegen generate && cd ..
          xcodebuild -project iosApp/MewZ.xcodeproj -scheme MewZ \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            YOUTUBE_API_KEY="$YOUTUBE_API_KEY" \
            build 2>&1 | tee ios.log
          exit ${PIPESTATUS[0]}

      - name: Package MewZ.ipa
        if: ${{ !cancelled() }}
        run: |
          app=$(find iosApp/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qry MewZ.ipa Payload
          echo "::notice title=IPA::$(du -h MewZ.ipa | cut -f1)"

      - name: Report
        if: always()
        run: |
          python3 .github/scripts/report.py ios-tests.log "iOS tests"
          python3 .github/scripts/report.py ios-tests.log "iOS test results" notice
          python3 .github/scripts/report.py ios-diag.log "iOS diagnosis" notice
          python3 .github/scripts/report.py ios-diag.log "iOS diagnosis log"
          python3 .github/scripts/report.py ios.log "Xcode build"

      - name: Publish (draft release ios-app)
        if: always()
        shell: bash
        run: |
          bash .github/scripts/publish.sh ios-app "MewZ for iPhone: install MewZ.ipa with Sideloadly or AltStore (docs/IPHONE.md)" \
            MewZ.ipa ios.log ios-tests.log ios-diag.log
